  <rect x="80" y="70" width="12" height="12" rx="2" fill="white" opacity="0.9"/>
  <rect x="95" y="70" width="12" height="12" rx="2" fill="white" opacity="0.9"/>
  
  <!-- Robot face -->
  <circle cx="45" cy="85" r="3" fill="#333"/>
  <circle cx="83" cy="85" r="3" fill="#333"/>
